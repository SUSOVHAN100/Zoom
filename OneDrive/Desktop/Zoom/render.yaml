services:
  # ─────────────────────────────────────────────
  # 1. FastAPI Backend (Python Web Service)
  # ─────────────────────────────────────────────
  - type: web
    name: zoomspace-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: zoomspace-db
          property: connectionString

  # ─────────────────────────────────────────────
  # 2. Next.js Frontend (Static Site)
  # ─────────────────────────────────────────────
  - type: web
    name: zoomspace-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20.0.0"
      - key: NEXT_PUBLIC_API_URL
        value: https://zoomspace-backend.onrender.com/api
      - key: NEXT_PUBLIC_WS_URL
        value: wss://zoomspace-backend.onrender.com

# ─────────────────────────────────────────────
# 3. PostgreSQL Database (Free Tier)
# ─────────────────────────────────────────────
databases:
  - name: zoomspace-db
    databaseName: zoomspace
    user: zoomspace_user
    plan: free
